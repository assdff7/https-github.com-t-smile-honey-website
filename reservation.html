<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホ対応に必須 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smile Honey ご予約フォーム</title>

  <style>
    /* =========================
       全体の基本設定
    ========================= */
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: linear-gradient(#fff3d6, #ffe2a8);
      color: #7a4a00;
    }

    /* コンテンツ全体の幅 */
    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    /* =========================
       ヘッダー（上部）
    ========================= */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header .logo {
      font-size: 40px;
    }

    .header h1 {
      margin: 8px 0 4px;
      font-size: 28px;
      letter-spacing: 2px;
    }

    .header p {
      margin: 0;
      font-size: 14px;
    }

    /* =========================
       商品カード
    ========================= */
    .product-card {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      margin-bottom: 32px;
    }

    .product-card h2 {
      margin: 12px 0 8px;
      font-size: 22px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 8px 0;
    }

    .price small {
      display: block;
      font-size: 12px;
      font-weight: normal;
    }

    /* =========================
       フォーム
    ========================= */
    .form-box {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .form-box h3 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
    }

    /* 各入力ブロック */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }

    label span {
      color: red;
      font-size: 12px;
      margin-left: 4px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ffcc80;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* 横並び（数量・日付） */
    .form-row {
      display: flex;
      gap: 12px;
    }

    /* =========================
       送信ボタン
    ========================= */
    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg, #ffb347, #ff9800);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 16px;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    /* =========================
       フッターアイコン風
    ========================= */
    .features {
      display: flex;
      justify-content: space-around;
      margin-top: 32px;
      font-size: 12px;
      text-align: center;
    }

    /* スマホでさらに見やすく */
    @media (max-width: 480px) {
      .header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- ヘッダー -->
    <div class="header">
      <div class="logo">🍯</div>
      <h1>SMILE HONEY</h1>
      <p>自然の恵みをそのままお届け</p>
    </div>

    <!-- 商品情報 -->
    <div class="product-card">
      <div style="font-size:32px;">🍯 😊</div>
      <h2>Smile Honey</h2>
      <p>笑顔になれる、特別な蜂蜜</p>
      <div class="price">
        ¥2,750（税込）
        <small>100mL / 税抜 ¥2,500</small>
      </div>
    </div>

    <!-- 予約フォーム -->
    <div class="form-box">
      <h3>📝 ご注文フォーム</h3>
<form>
  <div class="form-group">
    <label>お名前 <span>（必須）</span></label>
    <input id="name" type="text" placeholder="例：山田 太郎" required>
  </div>

  <div class="form-group">
    <label>メールアドレス <span>（必須）</span></label>
    <input id="email" type="email" placeholder="example@example.com" required>
  </div>

  <div class="form-group">
    <label>電話番号 <span>（必須）</span></label>
    <input id="phone" type="tel" placeholder="090-1234-5678" required>
  </div>

  <div class="form-group">
    <label>商品名</label>
    <input id="product" type="text" value="Smile Honey" readonly>
  </div>

 <div class="form-row">
  <div class="form-group" style="flex:1;">
    <label>数量 <span>（必須）</span></label>

    <!-- ★ 在庫表示をここに追加！ -->
    <div id="stock_display" style="margin-bottom: 6px; color:#555;">在庫：8</div>

    <input id="quantity" type="number" min="1" value="1" required>
  </div>

  <div class="form-group" style="flex:1;">
    <label>お届け日 <span>（必須）</span></label>
    <input id="delivery_date" type="date" required>
  </div>
</div>


  <div class="form-group">
    <label>お支払い方法 <span>（必須）</span></label>
    <select id="payment_method" required>
      <option value="bank">銀行振込</option>
      <option value="cod">代金引換</option>
    </select>
  </div>

  <div class="form-group">
    <label>備考欄</label>
    <textarea id="note" placeholder="ご要望があればご記入ください"></textarea>
  </div>

  <button type="button" class="submit-btn" onclick="sendReserve()">ご注文を確定する</button>
</form>

    </div>

    <!-- 下部アイコン -->
    <div class="features">
      <div>🐝<br>国産100%</div>
      <div>✨<br>非加熱</div>
      <div>📦<br>丁寧梱包</div>
    </div>

  </div>
<script>
const API_BASE = "https://six-cingular-cents-acting.trycloudflare.com";

// 空き枠取得
function loadSlots(date) {
  fetch(`${API_BASE}/api/slots?date=${date}`)
    .then(res => res.json())
    .then(data => {
      console.log("空き枠:", data);
    });
}

// 予約送信
async function sendReserve() {
  const name = document.querySelector("#name").value;
  const date = document.querySelector("#delivery_date").value;
  const time = "10:00"; // ← 時間を選ぶ UI ができたらここを書き換える

  const response = await fetch(`${API_BASE}/api/reserve`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, date, time })
  });

  const data = await response.json();
  console.log("予約結果:", data);

  // ★ FastAPI が success を返したら完了ページへ
  if (data.success) {
    window.location.href = "/https-github.com-t-smile-honey-website/complete.html";


  }
}

</script>


</body>
</html>
