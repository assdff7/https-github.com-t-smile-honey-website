<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

      color: #7a4a00;
      text-align: center;
      padding: 40px 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(90deg, #ffb347, #ff9800);
      color: #fff;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo">🍯</div>
